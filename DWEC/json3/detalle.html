<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de la publicación</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand mb-0 h1" href="index.html">Mi Blog</a>
        </div>
    </nav>

    <main class="container">
        <a href="index.html" class="btn btn-outline-secondary btn-sm mb-3">&larr; Volver</a>

        <!-- Aquí pinta detalle.js la publicación -->
        <article id="post" class="card card-body mb-4"></article>

        <h2 class="h4">Comentarios</h2>
        <ul id="listaComentarios" class="list-group mb-4"></ul>

        <h3 class="h5">Añadir comentario</h3>
       <form id="formComentario" class="card card-body">
    <div class="mb-3">
        <label for="userId" class="form-label">Comentar como</label>
        <select class="form-select" id="userId" name="userId" required></select>
    </div>
    <div class="mb-3">
        <label for="body" class="form-label">Comentario</label>
        <textarea class="form-control" id="body" name="body" rows="3" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Enviar</button>
</form>

        <p id="mensajeError" class="text-danger mt-3"></p>
    </main>

    <script src="detalle.js"></script>
</body>
</html>
