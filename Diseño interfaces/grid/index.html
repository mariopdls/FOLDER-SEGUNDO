<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>

    <header class="cabecera" id="inicio">
        <h1>Galería de Fotografías</h1>
        <p>Paisajes de todo el mundo</p>
    </header>

    <nav class="menu">
        <a href="#inicio">Inicio</a>
        <a href="#galeria">Galería</a>
        <a href="#contacto">Contacto</a>
    </nav>

    <main class="contenido">
        <section class="galeria" id="galeria">
            <article class="foto foto1">
                <img src="img/foto1.jpg" alt="Paisaje 1">
                <h3>Fotografía 1</h3>
            </article>

            <article class="foto foto2">
                <img src="img/foto2.webp" alt="Paisaje 2">
                <h3>Fotografía 2</h3>
            </article>

            <article class="foto foto3">
                <img src="img/foto3.jpeg" alt="Paisaje 3">
                <h3>Fotografía 3</h3>
            </article>

            <article class="foto foto4">
                <img src="img/foto4.jpeg" alt="Paisaje 4">
                <h3>Fotografía 4</h3>
            </article>

            <article class="foto foto5">
                <img src="img/foto5.jpg" alt="Paisaje 5">
                <h3>Fotografía 5</h3>
            </article>

            <article class="foto foto6">
                <img src="img/foto6.webp" alt="Paisaje 6">
                <h3>Fotografía 6</h3>
            </article>
        </section>
    </main>

    <footer class="pie" id="contacto">
        <p>Contacto: correo@ejemplo.com</p>
        <p>&copy; 2026 Galería de Fotografías</p>
    </footer>

</body>
</html>
